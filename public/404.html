<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Sayfa bulunamadı · ÜrünTakipte</title>
    <style>
      :root { --bg: #f9fbfa; --fg: #10201d; --muted: #52645f; --primary: #005c55; --on-primary: #ffffff; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0b1211; --fg: #e7f0ee; --muted: #9db3ae; --primary: #6fd6c8; --on-primary: #00302b; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--fg);
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main { max-width: 420px; text-align: center; }
      .code { font-size: 4rem; font-weight: 800; color: var(--primary); line-height: 1; margin: 0 0 8px; }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
      a {
        display: inline-block; padding: 12px 22px; border-radius: 999px; text-decoration: none; font-weight: 600;
        background: var(--primary); color: var(--on-primary);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Sayfa bulunamadı</h1>
      <p>Aradığın sayfa taşınmış ya da hiç var olmamış olabilir.</p>
      <a href="/">Ana sayfaya dön</a>
    </main>
  </body>
</html>
